name: "⑥ Weekly Newsletter — Monday 12:00 Madrid"

# weekly.json is refreshed every morning by daily.yml (06:00 UTC), so it is
# already hours-fresh by the time this job runs — no extra lead time needed.
#
# 10:00 UTC = 12:00 Madrid (CEST, summer, UTC+2)
#           = 11:00 Madrid (CET,  winter, UTC+1) — 1 hour early; drift accepted.
#
# For an exact 12:00 Madrid send year-round, replace the single cron below
# with this pair instead (mirrors the approach used on the expo2030.co mailer):
#   - cron: '0 10 * 4-9 1'      # Apr-Sep, CEST exact
#   - cron: '0 11 * 1-3,10-12 1' # Oct-Mar, CET exact

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:          # Allow manual re-send

permissions:
  contents: write

jobs:
  newsletter:
    name: Generate & dispatch newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main           # Always use latest (after roundup commit)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Generate newsletter
        run: python generate_newsletter.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Send newsletter
        run: python send_newsletter.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Build newsletter archive page
        run: python build.py --newsletter

      - name: Commit newsletter archive
        run: |
          git config user.name  "FitOut Post Bot"
          git config user.email "bot@fitoutpost.com"
          git add newsletter_latest.html newsletter_archive.json newsletter.html
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore(newsletter): $(date -u '+%Y-%m-%d') edition"
          git pull --rebase origin main
          git push
