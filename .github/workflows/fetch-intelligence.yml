name: "④ Intelligence + Countries — Quarterly, 1st of Jan/Apr/Jul/Oct, 08:00 UTC"

on:
  workflow_dispatch:   # manual trigger, plus the schedule below
  schedule:
    # Fires on the first day of each calendar quarter — next run: 1 Jul 2026 (Q3).
    # Quarterly cadence matches the publication rhythm of the occupier cost guides
    # this feed draws on (CBRE, JLL, Cushman & Wakefield, Turner & Townsend,
    # Savills etc. all publish annual/semi-annual guides, not monthly data) —
    # a monthly/daily fetch was producing empty periods between releases.
    - cron: '0 8 1 1,4,7,10 *'

permissions:
  contents: write

jobs:
  fetch-intelligence:
    name: Fetch intelligence data & rebuild intelligence/countries pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests feedparser python-dateutil tqdm beautifulsoup4

      - name: Fetch intelligence data
        run: python fetch_intelligence.py --all-known
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"

      - name: Build intelligence & country pages
        run: |
          python build.py --intelligence
          python build_country_pages.py

      - name: Commit & push
        run: |
          git config user.name  "FitOut Post Bot"
          git config user.email "bot@fitoutpost.com"
          git add intelligence.json intelligence.html countries/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore(intelligence): quarterly update $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
