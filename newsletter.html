{"last_updated":"2026-07-20T12:09:15Z","newsletters":[{"id":"2026-W29","week_label":"13 Jul – 19 Jul 2026","sent_at":"2026-07-20T12:09:15Z","editorial":"Ireland dominates this week's signals, emerging as a dual-track market with sharply divergent fortunes. While Interiors International lands a headline-grabbing AED 150m contract from Luxe Developers for the Oceano project, a parallel litigation story signals quality control fractures in the mortgage-to-rent conversion space. The broader picture reveals Ireland as both a magnet for fit-out capital and a cautionary tale about standards enforcement—a tension that deserves scrutiny as the market scales.\n\nPipeline momentum centres on data centre and commercial infrastructure plays. Ireland's reopening data centre corridor presents the week's most tangible opportunity, with facility fit-out emerging as a competitive differentiator for developers betting on white-space economics. Simultaneously, Saudi Arabia's Neom and associated mixed-use developments, plus Australia's 200MW Sydney tech campus, underscore the geographic concentration of major capital allocation in infrastructure-heavy geographies where fit-out specifications carry strategic weight.\n\nThree tender opportunities emerged: Ireland's ground floor fit-out for a new policing facility (OPW), exhibition design and manufacturing for Donegal's Famine Heritage site, and a UNHCR digital innovation centre. These represent smaller-ticket work across civic, cultural and humanitarian sectors—categories often overlooked in headlines but indicative of diversification beyond commercial property.\n\nAs data centre demand reshapes infrastructure priorities globally, fit-out practitioners face an uncomfortable question: can supply-side capacity and quality oversight scale alongside velocity? Ireland's litigation noise suggests not all players are ready for the acceleration ahead.","stats":{"total":191,"news":34,"pipeline":148,"tenders":8,"awards":1}},{"id":"2026-W28","week_label":"6 Jul – 12 Jul 2026","sent_at":"2026-07-13T12:26:23Z","editorial":"Hospitality and retail are driving the week's momentum, with a concentration of hotel openings and mixed-use developments signalling sustained demand across Asia-Pacific and the Middle East. Hilton's entry into Thessaloniki, Marriott's Abha expansion, and Sydney's incoming Waldorf Astoria represent the kind of pipeline confidence that typically precedes fit-out tender releases. More tellingly, luxury resort completions — from Grenada to the Maldives — suggest clients remain willing to invest in premium finishes despite broader economic uncertainty.\n\nCapital spending is directing itself toward long-cycle hospitality projects and government-backed infrastructure. Qatar's Lusail development assignment to Parsons, coupled with Ireland's €4.55bn campus capital programme running through 2030, promises sustained contractor workflow. The Middle East and North Africa continue attracting disproportionate investment, whilst Canada's $1bn+ pipeline and Australia's hotel cluster indicate North American resilience. These funds will eventually translate into procurement, though the lag between announcement and tender typically extends four to six months.\n\nTender activity remains sparse this week — only four active opportunities recorded — with Malaysia's RM63.5m hospitality contract representing the sole significant award. This thinness is seasonal rather than alarming. Ireland's €4.55bn campus programme deserves particular attention for fit-out specialists: it's long-duration, publicly funded, and regional. The absence of European commercial development signals outside this campus context suggests corporates are still evaluating workplace transformation ROI.\n\nAs luxury hospitality accelerates globally, the question for contractors centres on capacity. Can regional fit-out firms scale to meet hotel opening timelines whilst maintaining margin in labour-constrained markets?","stats":{"total":190,"news":28,"pipeline":157,"tenders":4,"awards":1}},{"id":"2026-W27","week_label":"29 Jun – 5 Jul 2026","sent_at":"2026-07-06T13:38:27Z","editorial":"The Gulf is reasserting itself as a major fit-out destination, with the UAE dominating this week's contract activity. Luxe Developers' $41m award for the Oceano residential tower in Ras Al Khaimah signals sustained confidence in the emirate's diversification strategy, even as the broader region pivots towards luxury hospitality expansion. Meanwhile, hospitality pipeline activity remains robust globally, anchored by IHG's aggressive Greater China rollout and Saudi Arabia's accelerating hotel openings ahead of 2030.\n\nCapital deployment is fragmenting across three distinct markets. The UAE continues to lock in large residential fit-out contracts, whilst European hospitality — particularly Vienna's Crowne Plaza and Italy's emerging resort cluster — is drawing mid-market investment. Concurrently, infrastructure spending is materialising in less obvious places: Ireland's €250m winter sports complex and Canada's 10,000-seat arena in Surrey both signal that leisure fit-out is capturing budgets previously reserved for office refurbishment.\n\nHealthcare infrastructure crept into the award column this week with J.E.T Construction's Northampton General Hospital project, alongside Ireland's €1.3bn HSE capital programme, which remains the region's most stable public-sector pipeline. These tenders matter: they introduce long-term contractual discipline into markets traditionally driven by speculative development.\n\nThe critical question facing suppliers now is whether collaborative workplace design will sustain its enlarged budget allocation beyond 2026, or whether cost discipline in the second half signals a return to leaner, function-first fit-outs.","stats":{"total":186,"news":18,"pipeline":155,"tenders":10,"awards":3}},{"id":"2026-W26","week_label":"22 Jun – 28 Jun 2026","sent_at":"2026-06-29T13:58:52Z","editorial":"Germany's fit-out sector is consolidating momentum around flexible workspace and residential refurbishment, with major contractors including Morgan Sindall Group expanding operations in the region. Simultaneously, Southeast Asia — particularly Malaysia and Oman — is witnessing accelerating investment in hospitality and commercial development, driven by tourism infrastructure and favourable financing conditions. The divergence underscores a broader pattern: mature markets favour adaptive reuse and workplace transformation, whilst emerging economies prioritise new-build hospitality and mixed-use development.\n\nCapital deployment remains heavily skewed toward hospitality pipelines across Africa, the Middle East, and the Caribbean, with Morocco, Egypt, and Oman leading regional growth. Australia's hotel sector is particularly active, though office refurbishment remains concentrated in Western markets. France's Eurosatory partnerships and Italy's cultural preservation projects indicate growing client appetite for specialised, high-specification fit-out work — suggesting margin potential for contractors with heritage expertise.\n\nTender activity remains modest, though Ireland's healthcare and retail sectors present immediate procurement opportunities. The UK's Cardiff office tender and Italy's RAI engineering services contract suggest steady institutional demand. Notably, no major contract awards have yet signalled pricing direction for H2 2026, leaving cost inflation narratives unvalidated by recent procurement outcomes.\n\nAs AI tools reshape workplace design baselines and cost expectations shift, the critical question for fit-out specialists is whether emerging-market tourism growth can sustain margins whilst mature markets demand increasingly bespoke, tech-integrated solutions at compressed budgets.","stats":{"total":234,"news":27,"pipeline":200,"tenders":7,"awards":0}},{"id":"2026-W25","week_label":"15 Jun – 21 Jun 2026","sent_at":"2026-06-25T16:30:54Z","editorial":"The hospitality sector dominates deal flow this week, signalling a decisive shift in capital allocation toward leisure and resort development. Egypt's £200m World Bank-backed expansion, the Mövenpick opening on the Croatian coast, and Rixos's Red Sea resort repositioning underscore investor confidence in leisure infrastructure across emerging markets. This pattern extends through the Caribbean and Australia, where hotel openings and experience centres are driving fit-out demand—a stark contrast to the prolonged office sector retrenchment.\n\nCommercial activity clusters in the Gulf and Asia-Pacific regions. Havelock One's contract award for The Avenues in Khobar signals confidence in Saudi mega-projects, whilst Qatar's innovation showcases and tourism awards framework suggest sustained regional investment momentum. Australian infrastructure approvals, including Brisbane Airport's expansion, create downstream pipeline opportunities for specifiers, though the broader commercial development picture remains cautiously incremental outside hospitality verticals.\n\nProcurement remains thin: just six active tenders this week, with the standout being Donegal's museum exhibition fit-out. The awards cycle itself generates visibility—FKM and NOS joining the Fit Out Awards 2026 sponsorship roster—but these signals reflect industry consolidation rather than new demand generation. The Irish market shows resilience through council-level Crown Square contract awards and McDonald's reinvestment.\n\nThe industry faces an uncomfortable question: can hospitality's cyclical momentum offset persistent commercial sector weakness? Specifiers should watch emerging markets' infrastructure timelines closely.","stats":{"total":193,"news":28,"pipeline":158,"tenders":6,"awards":1}},{"id":"2026-W19","week_label":"4 May – 10 May 2026","sent_at":"2026-05-14T11:35:00Z","editorial":"The dominant story this week runs through two very different geographies. In the United Kingdom, fit-out contractors are circling a £60 million assignment for a US bank's new City of London premises — a signal that corporate office investment, despite well-documented post-pandemic caution, retains its appetite for prestige specification. Against that, the closure of Pure Fitout's bespoke Belfast joinery operation within weeks of its acquisition serves as a reminder that the specialist end of the supply chain remains under structural pressure.\n\nPipeline activity this week is overwhelmingly concentrated in hospitality. Oman alone accounts for three separate hotel opening signals, reinforcing the Gulf's position as the most active interior fit-out market outside Western Europe. Beyond the Middle East, the Hyatt pipeline — now at 151,000 rooms globally — and Banyan Tree's US$100 million transformation of Mayakoba together indicate that international hotel brands are deploying capital at scale. The Powerhouse Parramatta museum opening in Australia late 2026 represents one of the more architecturally significant cultural commissions tracked this week.\n\nProcurement activity was light: a single confirmed fit-out contract — RM2.1 million for the Maybank KLCC project in Kuala Lumpur — appeared via the Malaysia tender channel. No EU or UK competitive tenders with confirmed deadlines were logged this week, though the JLL Asia Pacific Fit-Out Cost Guide 2026 was published, offering useful benchmarking for practitioners pricing work across the region.\n\nThe contrast between the Gulf's construction certainty and the UK's supply chain fragility poses a question the industry has not yet answered: how many specialist contractors are building sustainable businesses, and how many are simply surviving the next cycle?","stats":{"total":174,"news":12,"pipeline":161,"tenders":1,"awards":0}}]}

  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --salmon:      #FFF1E5;
    --salmon-dk:   #F2DFCE;
    --salmon-md:   #FAE8D6;
    --white:       #FFFFFF;
    --black:       #1a1a1a;
    --black-mid:   #262626;
    --claret:      #990033;
    --claret-lt:   #CC0044;
    --teal:        #0D7680;
    --amber:       #E8820C;
    --warm-gray:   #66605A;
    --mid-gray:    #9A948E;
    --card-bg:     #FFFFFF;
    --body-bg:     #FAF5F0;
    --border:      #D8C9A8;
    --border-dk:   #BBA898;
    --serif:  'Playfair Display', 'EB Garamond', Georgia, serif;
    --sans:   Inter, system-ui, sans-serif;
  }
  html  { scroll-behavior: smooth; font-size: 16px; }
  body  { font-family: var(--sans); background: var(--salmon); color: var(--black);
          min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--claret); }

  /* ── Utility bar ─────────────────────────────────────────────────────────── */
  #utility-bar { background: var(--black); color: #9A8A80; font-size: 11px;
    letter-spacing: 0.3px; border-bottom: 1px solid #333; padding: 0 24px; }
  #utility-inner { max-width: 1320px; margin: 0 auto; height: 34px;
    display: flex; align-items: center; justify-content: space-between; }
  #utility-left, #utility-right { display: flex; align-items: center; gap: 20px; }
  .util-link { color: #9A8A80; transition: color .15s; }
  .util-link:hover { color: #D4C4BA; }

  /* ── Masthead ────────────────────────────────────────────────────────────── */
  #masthead { background: var(--salmon); border-bottom: 2px solid var(--black);
    position: sticky; top: 0; z-index: 200; }
  #masthead-inner { max-width: 1320px; margin: 0 auto; padding: 0 24px;
    height: 72px; display: flex; align-items: center; gap: 24px; }
  #fop-logo { display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    cursor: default; user-select: none; text-decoration: none; }
  #fop-logo:hover { color: inherit; }
  #fop-box { width: 52px; height: 52px; background: var(--black);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #fop-box span { font-family: var(--serif); font-weight: 800; font-size: 24px;
    letter-spacing: 1px; color: #fff; line-height: 1; }
  #fop-wordmark { display: flex; flex-direction: column; line-height: 1.2; }
  #fop-wordmark strong { font-family: var(--serif); font-weight: 700; font-size: 20px;
    letter-spacing: 0.2px; color: var(--black); }
  #fop-wordmark em { font-style: normal; font-size: 10px; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--warm-gray); font-weight: 500; margin-top: 2px; }
  #masthead-right { margin-left: auto; display: flex; align-items: center;
    gap: 16px; flex-shrink: 0; }
  .masthead-nav-link { font-size: 12.5px; font-weight: 500; color: var(--black);
    padding: 6px 14px; border: 1px solid var(--border-dk);
    transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
  .masthead-nav-link:hover { background: var(--black); border-color: var(--black); color: #fff; }
  .masthead-nav-link.active { background: var(--black); border-color: var(--black); color: #fff; }
  .masthead-nav-link--cta { background: var(--claret); border-color: var(--claret);
    color: #fff; font-weight: 600; padding: 6px 18px; letter-spacing: 0.2px; }
  .masthead-nav-link--cta:hover { background: var(--claret-lt); border-color: var(--claret-lt); color: #fff; }

  /* ── Product nav ─────────────────────────────────────────────────────────── */
  #product-nav { background: var(--black); position: sticky; top: 72px; z-index: 195; }
  #product-nav-inner { max-width: 1320px; margin: 0 auto; padding: 0 24px;
    display: flex; gap: 0; }
  .pnav-link { display: inline-block; padding: 0 20px; height: 38px; line-height: 38px;
    font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,.65); letter-spacing: .3px;
    border-right: 1px solid rgba(255,255,255,.1); transition: color .15s, background .15s;
    white-space: nowrap; cursor: pointer; }
  .pnav-link:first-child { border-left: 1px solid rgba(255,255,255,.1); }
  .pnav-link:hover { color: #fff; background: rgba(255,255,255,.08); }
  .pnav-link.active { color: #fff; background: var(--claret); border-color: var(--claret); }
  .pnav-link.active + .pnav-link { border-left-color: var(--claret); }

  /* ── Section header ──────────────────────────────────────────────────────── */
  .sec-header { background: var(--black); color: #fff; padding: 40px 0 32px; border-bottom: 1px solid #333; }
  .sec-header-inner { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  .sec-title { font-family: var(--serif); font-size: 46px; font-weight: 700; line-height: 1.2;
    color: #fff; margin-bottom: 8px; }
  .sec-title span { color: var(--claret); }
  .sec-tagline { font-size: 14px; color: rgba(255,255,255,.55); max-width: 520px; line-height: 1.6; }

  /* ── Edition selector bar ────────────────────────────────────────────────── */
  #edition-bar { background: var(--salmon); border-bottom: 1px solid var(--border);
    padding: 10px 24px; }
  #edition-bar-inner { max-width: 1320px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #edition-bar label { font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--warm-gray); }
  #edition-select { padding: 5px 10px; font-size: 13px; font-family: var(--sans);
    border: 1px solid var(--border); background: var(--white); color: var(--black);
    cursor: pointer; outline: none; }
  #edition-select:focus { border-color: var(--black); }
  #edition-meta { font-size: 12px; color: var(--mid-gray); margin-left: auto; }

  /* ── Main layout ─────────────────────────────────────────────────────────── */
  #main { max-width: 1320px; margin: 0 auto; padding: 40px 24px 80px; }

  /* ── Member gate / paywall ────────────────────────────────────────────────── */
  .paywall-box {
    max-width: 540px; margin: 80px auto; text-align: center; padding: 48px 40px;
    background: var(--white); border: 1px solid var(--border);
  }
  .paywall-box .pw-kicker {
    font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--claret); margin-bottom: 16px;
  }
  .paywall-box h2 {
    font-family: var(--serif); font-size: 28px; font-weight: 700;
    margin-bottom: 14px; color: var(--black); line-height: 1.25;
  }
  .paywall-box p { font-size: 14px; color: var(--warm-gray); line-height: 1.65; margin-bottom: 24px; }
  .paywall-cta { display: inline-block; background: var(--claret); color: #fff;
    padding: 12px 36px; font-size: 13px; font-weight: 600; letter-spacing: .3px;
    text-decoration: none; transition: background .15s; }
  .paywall-cta:hover { background: var(--claret-lt); color: #fff; }
  .paywall-signin { margin-top: 16px; font-size: 12px; color: var(--mid-gray); }
  .paywall-signin a { color: var(--claret); }

  /* ── Newsletter letter ───────────────────────────────────────────────────── */
  #newsletter-wrap { max-width: 740px; margin: 0 auto; }

  .letter-header {
    border-bottom: 2px solid var(--black); padding-bottom: 20px; margin-bottom: 32px;
  }
  .letter-kicker {
    font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--claret); margin-bottom: 10px;
  }
  .letter-edition {
    font-family: var(--serif); font-size: 32px; font-weight: 700; line-height: 1.15;
    color: var(--black); margin-bottom: 6px;
  }
  .letter-dateline {
    font-size: 12px; color: var(--warm-gray); letter-spacing: .5px;
  }

  /* ── Signal stats strip ──────────────────────────────────────────────────── */
  .stats-strip {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 0; border: 1px solid var(--border); margin-bottom: 36px;
  }
  .stat-cell {
    padding: 14px 12px; text-align: center; border-right: 1px solid var(--border);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-cell .stat-n { font-family: var(--serif); font-size: 26px; font-weight: 700;
    color: var(--black); line-height: 1; }
  .stat-cell .stat-l { font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--warm-gray); margin-top: 4px; }

  /* ── Editorial text ──────────────────────────────────────────────────────── */
  .letter-editorial {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 18px; line-height: 1.75; color: var(--black);
    margin-bottom: 40px;
  }
  .letter-editorial p { margin-bottom: 1.4em; }
  .letter-editorial p:last-child { margin-bottom: 0; }

  /* ── Read more CTA ───────────────────────────────────────────────────────── */
  .letter-footer {
    border-top: 1px solid var(--border); padding-top: 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .letter-footer-note { font-size: 12px; color: var(--warm-gray); line-height: 1.5; }
  .letter-cta { display: inline-block; background: var(--black); color: #fff;
    padding: 10px 24px; font-size: 12px; font-weight: 600; letter-spacing: .3px;
    text-decoration: none; transition: background .15s; white-space: nowrap; }
  .letter-cta:hover { background: var(--black-mid); color: #fff; }

  /* ── Responsive ──────────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    #utility-bar { display: none; }
    #masthead-inner { height: 56px; padding: 0 12px; }
    #fop-box { width: 34px; height: 34px; }
    #fop-box span { font-size: 13px; }
    #product-nav { top: 56px; overflow-x: auto; scrollbar-width: none; }
    #product-nav::-webkit-scrollbar { display: none; }
    #product-nav-inner { padding: 0; width: max-content; min-width: 100%; }
    .pnav-link { padding: 0 13px; font-size: 11.5px; height: 36px; line-height: 36px; }
    #main { padding: 24px 16px 60px; }
    .letter-edition { font-size: 24px; }
    .letter-editorial { font-size: 16px; }
    .stats-strip { grid-template-columns: repeat(3, 1fr); }
    .stat-cell:nth-child(3) { border-right: none; }
    .letter-footer { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 430px) {
    .stats-strip { grid-template-columns: repeat(2, 1fr); }
    .stat-cell:nth-child(2) { border-right: none; }
    .paywall-box { padding: 32px 20px; }
    .paywall-box h2 { font-size: 22px; }
  }

<div id="main">
  <div id="newsletter-container">
    <div style="text-align:center;padding:80px 0;color:var(--warm-gray);">Loading…</div>
  </div>
</div>



<script>
/* ─── Data ─────────────────────────────────────────────────────────────────── */
let DATA = null;
const slot = document.getElementById("newsletter-data");
if (slot && slot.textContent.trim()) {
  try { DATA = JSON.parse(slot.textContent); } catch(e) { console.error("Newsletter data error:", e.message); }
}

/* ─── Member check ──────────────────────────────────────────────────────────── */
function isRegistered() {
  try {
    const m = JSON.parse(localStorage.getItem('fop_member') || 'null');
    return !!(m && (m.email || m.id));
  } catch(e) { return false; }
}

/* ─── Escape ────────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ─── Populate selector ─────────────────────────────────────────────────────── */
function populateSelector(newsletters) {
  const sel = document.getElementById("edition-select");
  if (!sel) return;
  sel.innerHTML = newsletters.map((n, i) =>
    `<option value="${i}">${esc(n.week_label)}</option>`
  ).join("");
}

/* ─── Format date ───────────────────────────────────────────────────────────── */
function fmtSent(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleDateString("en-GB", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
  } catch(e) { return iso.slice(0, 10); }
}

/* ─── Render one newsletter ─────────────────────────────────────────────────── */
function renderNewsletter(idx) {
  const container = document.getElementById("newsletter-container");
  const newsletters = DATA ? DATA.newsletters : [];
  const n = newsletters[parseInt(idx, 10)] || newsletters[0];
  if (!n) {
    container.innerHTML = `<p style="text-align:center;color:var(--warm-gray);padding:80px 0;">No newsletters yet.</p>`;
    return;
  }

  // Update meta
  { const el = document.getElementById("edition-meta");
    if (el) el.textContent = `Sent ${fmtSent(n.sent_at)}`; }

  // Stats
  const stats = n.stats || {};
  const statHTML = `
    <div class="stats-strip">
      <div class="stat-cell">
        <div class="stat-n">${stats.total ?? "—"}</div>
        <div class="stat-l">Signals</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n">${stats.news ?? "—"}</div>
        <div class="stat-l">News</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n">${stats.pipeline ?? "—"}</div>
        <div class="stat-l">Pipeline</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n">${stats.tenders ?? "—"}</div>
        <div class="stat-l">Tenders</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n">${stats.awards ?? "—"}</div>
        <div class="stat-l">Awards</div>
      </div>
    </div>`;

  // Editorial — split on double newlines to make paragraphs
  const paras = (n.editorial || "").split(/\n\n+/).filter(Boolean);
  const editHTML = paras.map(p => `<p>${esc(p.trim())}</p>`).join("\n");

  container.innerHTML = `
    <div id="newsletter-wrap">
      <div class="letter-header">
        <div class="letter-kicker">FitOut Post — Editor's Brief</div>
        <div class="letter-edition">${esc(n.week_label)}</div>
        <div class="letter-dateline">${fmtSent(n.sent_at)}</div>
      </div>
      ${statHTML}
      <div class="letter-editorial">${editHTML}</div>
      <div class="letter-footer">
        <div class="letter-footer-note">
          The full signal data — pipeline projects, active tenders, and contract awards —
          is available in the weekly roundup.
        </div>
        <a class="letter-cta" href="weekly.html">Read the full roundup →</a>
      </div>
    </div>`;
}

/* ─── Paywall ───────────────────────────────────────────────────────────────── */
function showPaywall() {
  const container = document.getElementById("newsletter-container");
  container.innerHTML = `
    <div class="paywall-box">
      <div class="pw-kicker">Members only</div>
      <h2>The weekly editorial briefing</h2>
      <p>Every Monday, FitOut Post members receive a concise editorial brief
         distilling the week's most significant fit-out industry signals —
         news, pipeline, tenders, and contract awards — into four focused paragraphs.</p>
      <a class="paywall-cta" href="register.html">Register free →</a>
      <div class="paywall-signin">
        Already a member? <a href="register.html">Sign in here</a>
      </div>
    </div>`;
}

/* ─── Init ──────────────────────────────────────────────────────────────────── */
{ const _ud = document.getElementById("utility-date");
  if (_ud) _ud.textContent = new Date().toLocaleDateString("en-GB",
    { weekday:"long", day:"numeric", month:"long", year:"numeric" }); }
{ const _fy = document.getElementById("footer-year");
  if (_fy) _fy.textContent = new Date().getFullYear(); }

if (isRegistered()) {
  const newsletters = (DATA && DATA.newsletters) || [];
  const bar = document.getElementById("edition-bar");
  if (bar) bar.style.display = "";
  if (newsletters.length) {
    populateSelector(newsletters);
    renderNewsletter(0);
  } else {
    document.getElementById("newsletter-container").innerHTML =
      `<p style="text-align:center;color:var(--warm-gray);padding:80px 0;font-family:var(--serif);font-style:italic;">
        No newsletters yet. The first edition will be sent next Monday.
      </p>`;
  }
} else {
  showPaywall();
}
</script>

<script></script>
<script src="cookie-consent.js"></script>
</body>
</html>
